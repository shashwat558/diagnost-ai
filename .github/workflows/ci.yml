name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis deps
        run: pip install numpy hdbscan scikit-learn httpx "psycopg[binary]" pytest
      - name: Unit tests
        working-directory: apps/analysis
        run: PYTHONPATH=src python -m pytest tests/ -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start infra stack
        run: docker compose up -d --wait

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.17.0
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install analysis deps (for acceptance scripts)
        run: pip install numpy hdbscan scikit-learn httpx "psycopg[binary]" joblib boto3

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Phase acceptance checks
        run: |
          bash tools/demo/run.sh phase0
          bash tools/demo/run.sh phase1
          bash tools/demo/run.sh phase2
          bash tools/demo/run.sh phase3
          bash tools/demo/run.sh phase4
          bash tools/demo/run.sh phase5
          bash tools/demo/run.sh phase6
          bash tools/demo/run.sh phase7
          bash tools/demo/run.sh phase7e
          bash tools/demo/run.sh phase7f
