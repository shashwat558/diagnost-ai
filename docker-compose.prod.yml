# Diagnost AI — production compose for single-VPS concierge installs.
# Customer pays ~$40-80/mo (8 vCPU / 32 GB). Run via tools/install.sh, which
# generates .env.prod, builds, migrates, provisions the owner and starts this.
#
# Usage:
#   docker compose -p diagnost-ai-prod -f docker-compose.prod.yml --env-file .env.prod up -d --wait
#   docker compose -p diagnost-ai-prod -f docker-compose.prod.yml --profile tls --env-file .env.prod up -d --wait  # with Caddy HTTPS
#
# App services run the already-built dist/ via bind mount (install.sh runs
# `pnpm build` first), so no image registry is needed for concierge deploys.

services:
  # ── Postgres: app DB ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diagnost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.prod}
      POSTGRES_DB: ${POSTGRES_DB:-diagnost}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diagnost} -d ${POSTGRES_DB:-diagnost}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── ClickHouse: event store ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-diagnost}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD in .env.prod}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-events}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
    volumes:
      - chdata:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/ping' | grep -q 'Ok.'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Redpanda: Kafka-compatible queue ──
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://127.0.0.1:9092
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 60s

  # ── MinIO: S3-compatible blob storage ──
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.prod}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY:-minioadmin}\" \"$${S3_SECRET_KEY}\" &&
      for b in transcripts finetune-datasets eval-artifacts; do mc mb -p \"local/$$b\"; done &&
      echo 'buckets ready'"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY in .env.prod}

  # ── Diagnost app services (built dist/ via bind mount) ──
  api:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.prod
    environment:
      API_PORT: ${API_PORT:-4100}
    command: ["node", "apps/api/dist/index.js"]
    ports:
      - "${API_PORT:-4100}:4100"
    depends_on:
      postgres:
        condition: service_started
      redpanda:
        condition: service_started

  consumer:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.prod
    command: ["node", "apps/api/dist/consumer.js"]
    depends_on:
      redpanda:
        condition: service_started
      clickhouse:
        condition: service_started
      postgres:
        condition: service_started

  notifier:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.prod
    command: ["node", "apps/api/dist/notifier.js"]
    depends_on:
      postgres:
        condition: service_started

  dashboard:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app/apps/dashboard
    volumes:
      - .:/app
    env_file:
      - .env.prod
    command: ["node", "/app/apps/dashboard/node_modules/next/dist/bin/next", "start", "-p", "3100"]
    ports:
      - "${DASHBOARD_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_started
      clickhouse:
        condition: service_started

  # ── Retention cron: per-plan TTL enforcement, daily ──
  retention-cron:
    image: node:20-bookworm-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.prod
    command: ["sh", "-c", "while true; do date; node packages/db/dist/bin/retention.js || true; sleep 86400; done"]
    depends_on:
      postgres:
        condition: service_started
      clickhouse:
        condition: service_started

  # ── Caddy: automatic HTTPS (tls profile; skip with --skip-tls) ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["tls"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - dashboard
      - api

volumes:
  pgdata:
  chdata:
  redpandadata:
  miniodata:
  caddy_data:
  caddy_config:
