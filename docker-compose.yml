name: diagnost-ai

services:
  # ── Postgres: app DB (workspaces, users, alerts, PR records, billing) ──
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-diagnost}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-diagnost_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-diagnost}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-diagnost} -d ${POSTGRES_DB:-diagnost}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── ClickHouse: high-cardinality event store ──
  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-diagnost}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-diagnost_dev_password}
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-events}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    cap_add:
      - SYS_NICE
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"   # HTTP interface
      - "${CLICKHOUSE_NATIVE_PORT:-9009}:9000" # native TCP (host 9009 avoids MinIO clash)
    volumes:
      - chdata:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:8123/ping' | grep -q 'Ok.'"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── Redpanda: Kafka-compatible event queue (single broker, dev mode) ──
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      # INTERNAL listener for containers, EXTERNAL advertised to host as 127.0.0.1
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://127.0.0.1:9092
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"
      - "29092:29092"
    volumes:
      - redpandadata:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:[[:space:]]+true'"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 60s

  # ── MinIO: S3-compatible blob storage (full transcripts) ──
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin_dev_password}
    ports:
      - "${S3_API_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # ── One-shot bucket creator ──
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$${S3_ACCESS_KEY:-minioadmin}\" \"$${S3_SECRET_KEY:-minioadmin_dev_password}\" &&
      for b in transcripts finetune-datasets eval-artifacts; do mc mb -p \"local/$$b\"; done &&
      echo 'buckets ready'"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin_dev_password}

  # ── MailHog: local SMTP capture (alert emails) ──
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "${SMTP_API_PORT:-8025}:8025"   # web UI + API
      - "1025:1025"                     # SMTP

volumes:
  pgdata:
  chdata:
  redpandadata:
  miniodata:
