[project]
name = "diagnost-analysis"
version = "0.1.0"
description = "Diagnost AI analysis workers: embeddings, HDBSCAN clustering, LLM-judge labeling, drift detection"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "hdbscan>=0.8.39",
    "scikit-learn>=1.6",
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
